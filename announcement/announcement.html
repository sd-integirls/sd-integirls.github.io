<!-- announcement bar will always be at the top so if you want to remove it, you have to remove the code from every single file
    which is quite the work, so i'd recommend u just put placeholder text and then remove the button if u have no link
    comment the button code by doing (cmd + /) or (ctrl + /)
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donate</title>
    <style>
        :root {
            --primary-color: #5e4d9e;
            --dark-color: #2c1b2d;
            --light-color: #C69AA4;
            --notsolight-color: #B58A94;
            --white-color: #ffffff;
            --header-font: 'Montserrat', sans-serif;
            --body-font: 'Lato', sans-serif;
            margin: 0 auto;
            padding: 0 0px;
        }
        
        body {
            margin: 0;
            font-family: var(--body-font);
        }

        .announcement {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem 1rem;
            align-items: center;
            min-height: 9vh;
            padding: 10px 16px;
            text-align: center;
            background-color: pink; /* changes the color of the header box */
        }

        .announcement span {
            color: black;
            margin: 0;
            padding: 0;
        }

        .announcement button {
            padding: 10px 30px;
            background-color: pink; /* changes the color of the button */
            color: black; /* changes the color of the text inside the button */
            border-radius: 5px;
            border-width: 1px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .announcement {
                font-size: 0.9rem;
            }
            .announcement button {
                padding: 6px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="announcement">
        <span>
            Our 2026 Winter Math Competition is coming soon! Stay tuned for more details!
        </span>
        <!-- insert the link of whatever you want the button to lead to, like a competition registration form -->
        <!-- <a href="https://docs.google.com/forms/d/e/1FAIpQLSeqBndCWekkxJaxlmr608c5nKC6923SEQ63lOThf1m7A1NvnA/viewform" target="_blank">
            <button>REGISTER HERE</button>
        </a> -->
    </div>
</body>
</html>
